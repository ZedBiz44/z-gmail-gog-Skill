  - "Legal or security matters"
  - "Suspicious email"
  - "Unapproved pricing, discounts, or promises"
  - "Angry-client situations"
  - "Private or sensitive information"
  - "Anything unclear"

business_record_location: "APPROVED_SYSTEM_OR_NONE"
may_update_business_records: false
