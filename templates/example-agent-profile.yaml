agent_name: "AGENT_NAME"
role: "AGENT_ROLE"

primary_google_account: "PRIMARY_GOOGLE_ACCOUNT"
from_name: "AGENT_DISPLAY_NAME"
from_email: "AGENT_EMAIL_ALIAS"
reply_to: "AGENT_EMAIL_ALIAS"
